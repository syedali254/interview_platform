services:
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
    volumes:
      - ./InterviewAI/core/livekit/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    restart: unless-stopped

  app:
    build:
      context: ./InterviewAI
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
      - "18765:18765"
    env_file:
      - ./InterviewAI/.env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_PUBLIC_URL=ws://localhost:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_SERVER_EXTERNAL=1
    depends_on:
      - livekit
    restart: unless-stopped