<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InterviewAI — Live Interview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    height: 100vh; display: flex; flex-direction: column;
  }

  .header {
    background: #1e293b; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #334155;
  }
  .header h1 { font-size: 1.2rem; color: #60a5fa; }

  .main { flex: 1; display: flex; padding: 16px; min-height: 0; }

  .welcome-panel {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
  }
  .welcome-panel .icon { font-size: 4rem; }
  .welcome-panel h2 { font-size: 1.8rem; color: #f1f5f9; }
  .welcome-panel p { color: #94a3b8; font-size: 1rem; max-width: 400px; text-align: center; line-height: 1.6; }
  .btn-start {
    padding: 16px 48px; border: none; border-radius: 12px;
    font-size: 1.2rem; cursor: pointer; font-weight: 600;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white; transition: all 0.3s;
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,99,235,0.4); }
  .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-start.connecting { background: linear-gradient(135deg, #f59e0b, #d97706); animation: pulse 1.5s infinite; }
  .btn-start.connected { background: linear-gradient(135deg, #22c55e, #16a34a); cursor: default; }
  .btn-start.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

  .connection-log {
    background: #1e293b; border-radius: 10px; padding: 16px;
    min-width: 350px; max-height: 200px; overflow-y: auto;
    border: 1px solid #334155; display: none;
  }
  .connection-log .entry {
    padding: 6px 0; font-size: 0.85rem; color: #94a3b8;
    border-bottom: 1px solid #1e293b;
  }
  .connection-log .entry.success { color: #4ade80; }
  .connection-log .entry.error { color: #f87171; }
  .connection-log .entry.active { color: #fbbf24; }

  .interview-panel { flex: 1; display: none; gap: 16px; min-height: 0; }
  .camera-panel { flex: 0 0 400px; display: flex; flex-direction: column; gap: 12px; }
  .camera-feed {
    flex: 1; background: #000; border-radius: 12px; overflow: hidden;
    position: relative; min-height: 300px;
  }
  .camera-feed video { width: 100%; height: 100%; object-fit: cover; }
  .camera-label {
    position: absolute; bottom: 12px; left: 12px;
    background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 6px;
    font-size: 0.8rem; color: #94a3b8;
  }
  .transcript-box {
    background: #1e293b; border-radius: 10px; padding: 16px;
    min-height: 80px; max-height: 140px; overflow-y: auto;
    border: 1px solid #334155;
  }
  .transcript-box .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .transcript-box .text { font-size: 0.95rem; line-height: 1.5; color: #f1f5f9; }
  .transcript-box .text.interim { color: #94a3b8; font-style: italic; }

  .conversation-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .question-display {
    background: linear-gradient(135deg, #1e3a5f, #1e293b);
    border-radius: 12px; padding: 20px; border: 1px solid #3b82f6;
    min-height: 80px; display: flex; flex-direction: column; justify-content: center;
  }
  .question-display .label { font-size: 0.7rem; color: #60a5fa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .question-display .text { font-size: 1.15rem; line-height: 1.6; color: #f8fafc; }
  .question-display .text.thinking { color: #94a3b8; font-style: italic; }

  .chat-log {
    flex: 1; background: #1e293b; border-radius: 10px; padding: 16px;
    overflow-y: auto; border: 1px solid #334155;
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat-log .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .chat-msg {
    padding: 10px 14px; border-radius: 10px; max-width: 85%;
    font-size: 0.9rem; line-height: 1.5;
  }
  .chat-msg.agent { background: #1e3a5f; color: #e2e8f0; align-self: flex-start; border: 1px solid #3b82f6; }
  .chat-msg.candidate { background: #1a3a2a; color: #e2e8f0; align-self: flex-end; border: 1px solid #22c55e; }
  .chat-msg .role { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .chat-msg.agent .role { color: #60a5fa; }
  .chat-msg.candidate .role { color: #4ade80; }

  .controls { padding: 12px 24px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 12px; align-items: center; }
  .btn-end {
    padding: 10px 24px; border: none; border-radius: 8px;
    font-size: 0.9rem; cursor: pointer; font-weight: 500;
    background: #dc2626; color: white; transition: all 0.2s;
  }
  .btn-end:hover { background: #b91c1c; }
  .btn-end:disabled { opacity: 0.5; cursor: not-allowed; }
  .mic-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #94a3b8; margin-left: auto; }
  .mic-indicator.active { color: #22c55e; }
</style>
</head>
<body>

<div class="header">
  <h1>🎙 InterviewAI — Live Voice Interview</h1>
  <div id="headerStatus" style="font-size:0.85rem;color:#94a3b8;">Not started</div>
</div>

<div class="main">
  <!-- Welcome Panel -->
  <div class="welcome-panel" id="welcomePanel">
    <div class="icon">🎤</div>
    <h2>Ready for your interview?</h2>
    <p>Click below to start. Make sure your microphone and camera are connected.</p>
    <button class="btn-start" id="startBtn">🎤 Start Interview</button>
    <div class="connection-log" id="logPanel"></div>
  </div>

  <!-- Interview Panel -->
  <div class="interview-panel" id="interviewPanel">
    <div class="camera-panel">
      <div class="camera-feed">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="camera-label">📷 You</div>
      </div>
      <div class="transcript-box">
        <div class="label">🎤 Your Speech</div>
        <div class="text" id="transcriptText">Waiting...</div>
      </div>
    </div>
    <div class="conversation-panel">
      <div class="question-display">
        <div class="label">📋 Question</div>
        <div class="text thinking" id="questionText">Interview starting...</div>
      </div>
      <div class="chat-log" id="chatLog">
        <div class="label">💬 Conversation</div>
      </div>
    </div>
  </div>
</div>

<div class="controls" id="controls" style="display:none;">
  <button class="btn-end" id="endBtn">⏹ End Interview</button>
  <div class="mic-indicator" id="micIndicator"><span id="micLabel">🎤 Mic inactive</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const webcam = $('webcam');
const startBtn = $('startBtn');
const endBtn = $('endBtn');
const welcomePanel = $('welcomePanel');
const interviewPanel = $('interviewPanel');
const controls = $('controls');
const chatLog = $('chatLog');
const questionText = $('questionText');
const transcriptText = $('transcriptText');
const micLabel = $('micLabel');
const micIndicator = $('micIndicator');
const headerStatus = $('headerStatus');
const logPanel = $('logPanel');

let room = null;
let camStream = null;
let conversationLog = [];

function addLog(text, type) {
  logPanel.style.display = 'block';
  const div = document.createElement('div');
  div.className = `entry ${type || ''}`;
  div.textContent = text;
  logPanel.appendChild(div);
  logPanel.scrollTop = logPanel.scrollHeight;
}

function addChat(role, text) {
  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  div.innerHTML = `<div class="role">${role === 'agent' ? '🤖 Interviewer' : '🧑 You'}</div>${text}`;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  conversationLog.push({ role, text, timestamp: new Date().toISOString() });
}

function setQuestion(text) {
  questionText.className = 'text';
  questionText.textContent = text || '—';
}

function setTranscript(text, isFinal) {
  transcriptText.className = `text${isFinal ? '' : ' interim'}`;
  transcriptText.textContent = text || 'Waiting...';
}

async function getToken() {
  const resp = await fetch('/token');
  if (!resp.ok) throw new Error(`Token error: ${resp.status}`);
  return resp.json();
}

function switchToInterview() {
  welcomePanel.style.display = 'none';
  interviewPanel.style.display = 'flex';
  controls.style.display = 'flex';
  headerStatus.textContent = 'Connected';
  headerStatus.style.color = '#4ade80';
}

async function connect() {
  try {
    startBtn.disabled = true;
    startBtn.textContent = '⏳ Connecting...';
    startBtn.className = 'btn-start connecting';
    addLog('Requesting interview token...', 'active');

    const { token, url, room: roomName, identity } = await getToken();
    addLog(`Connected to session: ${roomName}`, 'success');

    startBtn.textContent = '⏳ Getting camera & mic...';
    camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    webcam.srcObject = camStream;
    addLog('Camera and microphone ready', 'success');

    startBtn.textContent = '⏳ Joining room...';
    room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

    room.on('dataReceived', (payload) => {
      try {
        const msg = JSON.parse(new TextDecoder().decode(payload));
        switch (msg.type) {
          case 'question':
            setQuestion(msg.text);
            addChat('agent', msg.text);
            break;
          case 'transcript':
            setTranscript(msg.text, msg.is_final);
            if (msg.is_final && msg.text.trim()) addChat('candidate', msg.text);
            break;
        }
      } catch(e) {}
    });

    room.on('disconnected', () => {
      if (camStream) camStream.getTracks().forEach(t => t.stop());
      interviewPanel.style.display = 'none';
      welcomePanel.style.display = 'flex';
      controls.style.display = 'none';
      startBtn.textContent = '🔄 Reconnect';
      startBtn.disabled = false;
      startBtn.className = 'btn-start';
      headerStatus.textContent = 'Disconnected';
      headerStatus.style.color = '#f87171';
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === 'audio') {
        const el = track.attach();
        el.id = 'agent-audio';
        document.body.appendChild(el);
        addLog('Agent audio connected', 'success');
      }
    });

    await room.connect(url, token);
    addLog('Joined room, publishing tracks...', 'active');

    const videoTrack = camStream.getVideoTracks()[0];
    const audioTrack = camStream.getAudioTracks()[0];
    await room.localParticipant.publishTrack(audioTrack, { source: 'microphone' });
    await room.localParticipant.publishTrack(videoTrack, { source: 'camera' });

    startBtn.textContent = '✅ Interview Started';
    startBtn.className = 'btn-start connected';
    addLog('Interview started — AI agent speaking...', 'success');
    setQuestion('⏳ AI agent is speaking...');
    setTranscript('The AI is speaking — listen carefully', false);
    switchToInterview();

  } catch (err) {
    console.error(err);
    startBtn.textContent = '🔄 Retry';
    startBtn.className = 'btn-start error';
    startBtn.disabled = false;
    addLog(`Error: ${err.message}`, 'error');
    if (camStream) camStream.getTracks().forEach(t => t.stop());
  }
}

function disconnect() {
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  if (room) room.disconnect();
  room = null;
  camStream = null;
  fetch('/save_transcript', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session: 'manual', conversation: conversationLog }),
  }).catch(() => {});
}

startBtn.addEventListener('click', connect);
endBtn.addEventListener('click', disconnect);
</script>
</body>
</html>
